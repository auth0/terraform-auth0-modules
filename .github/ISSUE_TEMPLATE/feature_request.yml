name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module does this concern? Pick "new module" to propose one.
      options:
        - b2b-saas-starter
        - new module
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is the limitation or gap you are experiencing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the module to do? Include example HCL if helpful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you have tried, or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, or anything else that would help evaluate this request.
